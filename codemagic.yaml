workflows:
  ios-testflight:
    name: Eco Operaciones - iOS (TestFlight interno)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: FIAR
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ecosistemadecomunicacion.ecoOperaciones
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Install Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Generate launcher icons and splash
        script: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Flutter build ipa (App Store / TestFlight)
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - luisenriqueiscc@gmail.com
        notify:
          success: true
          failure: true
